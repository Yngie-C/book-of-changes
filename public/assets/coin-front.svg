<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="동전 앞면 (양)">
  <defs>
    <!-- Base gold gradient -->
    <radialGradient id="frontBase" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#F0C96B"/>
      <stop offset="42%"  stop-color="#D4A853"/>
      <stop offset="72%"  stop-color="#C5963A"/>
      <stop offset="100%" stop-color="#A07828"/>
    </radialGradient>

    <!-- Inner rim gradient -->
    <radialGradient id="frontRim" cx="50%" cy="50%" r="50%">
      <stop offset="78%"  stop-color="transparent"/>
      <stop offset="85%"  stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="92%"  stop-color="rgba(180,130,40,0.4)"/>
      <stop offset="100%" stop-color="rgba(120,80,10,0.5)"/>
    </radialGradient>

    <!-- Gloss highlight -->
    <radialGradient id="frontGloss" cx="36%" cy="28%" r="40%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="coinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(140,90,10,0.4)"/>
    </filter>

    <!-- Clip to circle -->
    <clipPath id="circleClip">
      <circle cx="36" cy="36" r="33"/>
    </clipPath>
  </defs>

  <!-- Outer edge ring -->
  <circle cx="36" cy="36" r="35" fill="#B8862A" opacity="0.6"/>

  <!-- Main coin body -->
  <circle cx="36" cy="36" r="33" fill="url(#frontBase)" filter="url(#coinShadow)"/>

  <!-- Inner beveled rim -->
  <circle cx="36" cy="36" r="33" fill="url(#frontRim)"/>

  <!-- Decorative dashed border ring -->
  <circle
    cx="36" cy="36" r="28"
    fill="none"
    stroke="rgba(255,255,255,0.30)"
    stroke-width="1"
    stroke-dasharray="3 3.5"
  />

  <!-- Second inner ring -->
  <circle
    cx="36" cy="36" r="23"
    fill="none"
    stroke="rgba(255,255,255,0.15)"
    stroke-width="0.75"
  />

  <!-- ─── Center motif: 三 (yang / 양효, three solid strokes) ─── -->
  <!-- Top stroke -->
  <rect x="26" y="28" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.75)"/>
  <!-- Middle stroke -->
  <rect x="26" y="34.5" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.75)"/>
  <!-- Bottom stroke -->
  <rect x="26" y="41" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.75)"/>

  <!-- Gloss overlay -->
  <circle cx="36" cy="36" r="33" fill="url(#frontGloss)" clip-path="url(#circleClip)"/>

  <!-- Top edge highlight -->
  <ellipse cx="36" cy="10" rx="18" ry="5" fill="rgba(255,255,255,0.22)"/>
</svg>
