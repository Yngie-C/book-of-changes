<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="동전 뒷면 (음)">
  <defs>
    <!-- Base dark bronze gradient -->
    <radialGradient id="backBase" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#A89070"/>
      <stop offset="42%"  stop-color="#8B7355"/>
      <stop offset="72%"  stop-color="#7A6345"/>
      <stop offset="100%" stop-color="#5E4D35"/>
    </radialGradient>

    <!-- Inner rim gradient -->
    <radialGradient id="backRim" cx="50%" cy="50%" r="50%">
      <stop offset="78%"  stop-color="transparent"/>
      <stop offset="85%"  stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="92%"  stop-color="rgba(120,90,50,0.4)"/>
      <stop offset="100%" stop-color="rgba(60,40,10,0.5)"/>
    </radialGradient>

    <!-- Gloss highlight (subtler than front) -->
    <radialGradient id="backGloss" cx="36%" cy="28%" r="40%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="coinShadowBack" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(60,40,10,0.5)"/>
    </filter>

    <!-- Clip to circle -->
    <clipPath id="circleClipBack">
      <circle cx="36" cy="36" r="33"/>
    </clipPath>
  </defs>

  <!-- Outer edge ring -->
  <circle cx="36" cy="36" r="35" fill="#5A4530" opacity="0.6"/>

  <!-- Main coin body -->
  <circle cx="36" cy="36" r="33" fill="url(#backBase)" filter="url(#coinShadowBack)"/>

  <!-- Inner beveled rim -->
  <circle cx="36" cy="36" r="33" fill="url(#backRim)"/>

  <!-- Decorative dashed border ring -->
  <circle
    cx="36" cy="36" r="28"
    fill="none"
    stroke="rgba(255,255,255,0.22)"
    stroke-width="1"
    stroke-dasharray="3 3.5"
  />

  <!-- Second inner ring -->
  <circle
    cx="36" cy="36" r="23"
    fill="none"
    stroke="rgba(255,255,255,0.10)"
    stroke-width="0.75"
  />

  <!-- ─── Center motif: 二 (yin / 음효, two broken strokes) ─── -->
  <!-- Top row: two half-strokes (broken) -->
  <rect x="22" y="30.5" width="11" height="3" rx="1.5" fill="rgba(255,255,255,0.62)"/>
  <rect x="39" y="30.5" width="11" height="3" rx="1.5" fill="rgba(255,255,255,0.62)"/>

  <!-- Bottom row: two half-strokes (broken) -->
  <rect x="22" y="38.5" width="11" height="3" rx="1.5" fill="rgba(255,255,255,0.62)"/>
  <rect x="39" y="38.5" width="11" height="3" rx="1.5" fill="rgba(255,255,255,0.62)"/>

  <!-- Gloss overlay -->
  <circle cx="36" cy="36" r="33" fill="url(#backGloss)" clip-path="url(#circleClipBack)"/>

  <!-- Top edge highlight -->
  <ellipse cx="36" cy="10" rx="18" ry="5" fill="rgba(255,255,255,0.14)"/>
</svg>
